# Distant Horizons config - TBA defaults. Only the settings TBA changes are listed; Distant Horizons
# fills in everything else with its own defaults, some of which depend on the machine (numberOfThreads),
# so do not ship a full file. _version must match the installed DH (3.3.x writes 5) or DH discards
# this file and rewrites defaults.
_version = 5

[common]
	[common.logging]
		[common.logging.warning]
			showExplicitGcDisabledWarning = false
			showSlowWorldGenSettingWarnings = false
			showUpdateQueueOverloadedChatWarning = false
			showLowMemoryWarningOnStartup = false
			showReplayWarningOnStartup = false
			showModCompatibilityWarningsOnStartup = false
			showHighVanillaRenderDistanceWarning = false
			showPoolInsufficientMemoryWarning = false
			showGarbageCollectorWarning = false

[client]
	[client.advanced]
		# The pack pins its Distant Horizons version; players should not be offered an update.
		[client.advanced.autoUpdater]
			enableAutoUpdater = false
			enableSilentUpdates = false
